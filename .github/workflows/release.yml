name: Release

on:
  push:
    tags: ['v*']

permissions:
  # Publishing is authenticated by a short-lived OIDC token, not a stored
  # secret. Without id-token: write there is no trusted publish and no
  # provenance attestation.
  id-token: write
  # Only so the job can cut the GitHub Release at the end.
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Trusted publishing does not support self-hosted runners.
    environment:
      name: npm
      url: https://www.npmjs.com/package/@notyet.im/ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          # Still required with trusted publishing — it writes the .npmrc that
          # points the CLI at the registry the OIDC token is exchanged with.
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1, and the npm bundled with any
      # given Node 24 patch is not guaranteed to clear that bar.
      - name: Ensure a recent npm
        run: npm install -g npm@latest

      - run: npm ci

      # The tag is the source of truth for the version; package.json carries a
      # placeholder that CI overwrites here. This replaced an assert that the
      # two agreed, which could only ever *detect* a mismatch - and did, on
      # v0.2.1, after the release had already been cut from the GitHub UI,
      # which has no way to write package.json.
      #
      # Losing that assert also loses the manifest as a second opinion on the
      # tag, so the two guards below take over its job: an npm version is
      # permanent, and a slipped tag would otherwise publish unchallenged.
      - name: Take the version from the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          case "$TAG" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Tag $GITHUB_REF_NAME is not a semver version"; exit 1 ;;
          esac
          LATEST="$(npm view @notyet.im/ui version 2>/dev/null || echo 0.0.0)"
          if [ "$LATEST" = "$TAG" ] \
             || [ "$(printf '%s\n%s\n' "$LATEST" "$TAG" | sort -V | tail -1)" != "$TAG" ]; then
            echo "::error::Tag $TAG is not greater than the published $LATEST"
            exit 1
          fi
          npm version "$TAG" --no-git-tag-version --allow-same-version
          echo "Publishing $TAG"

      # Explicit, though prepublishOnly runs it again during publish. The
      # duplicate costs seconds and buys a named failing step in the UI;
      # prepublishOnly stays because it is what protects a local publish.
      - name: Gate
        run: npm run check

      # prepack builds dist/ from this checkout, so the tarball can never be
      # stale — dist/ is gitignored and absent until this runs.
      # --provenance is redundant under trusted publishing but harmless, and it
      # keeps this correct if the trusted-publisher config is ever lost.
      - name: Publish to npm
        run: npm publish --provenance --access public

      # Idempotent: a release cut from the GitHub UI creates the tag, which
      # triggers this workflow, which would then fail creating a release that
      # already exists - after a successful publish, so the run goes red for
      # nothing. Fall back to editing whatever is already there.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            || gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME"
