name: Release

on:
  push:
    tags: ['v*']

permissions:
  # Publishing is authenticated by a short-lived OIDC token, not a stored
  # secret. Without id-token: write there is no trusted publish and no
  # provenance attestation.
  id-token: write
  # Only so the job can cut the GitHub Release at the end.
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Trusted publishing does not support self-hosted runners.
    environment:
      name: npm
      url: https://www.npmjs.com/package/@notyet.im/ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          # Still required with trusted publishing — it writes the .npmrc that
          # points the CLI at the registry the OIDC token is exchanged with.
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1, and the npm bundled with any
      # given Node 24 patch is not guaranteed to clear that bar.
      - name: Ensure a recent npm
        run: npm install -g npm@latest

      - run: npm ci

      # A tag that disagrees with the manifest publishes a version nobody
      # asked for, and npm versions cannot be replaced. Fail before that.
      - name: Assert the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "Publishing $PKG"

      # Explicit, though prepublishOnly runs it again during publish. The
      # duplicate costs seconds and buys a named failing step in the UI;
      # prepublishOnly stays because it is what protects a local publish.
      - name: Gate
        run: npm run check

      # prepack builds dist/ from this checkout, so the tarball can never be
      # stale — dist/ is gitignored and absent until this runs.
      # --provenance is redundant under trusted publishing but harmless, and it
      # keeps this correct if the trusted-publisher config is ever lost.
      - name: Publish to npm
        run: npm publish --provenance --access public

      # Idempotent: a release cut from the GitHub UI creates the tag, which
      # triggers this workflow, which would then fail creating a release that
      # already exists - after a successful publish, so the run goes red for
      # nothing. Fall back to editing whatever is already there.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            || gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME"
